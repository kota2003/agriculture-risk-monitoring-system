      - {code: '122', name: 'NSW Central West',                            zone: Wheat-Sheep,   lat: -32.4592, lon: 148.2871}
      - {code: '123', name: 'NSW Riverina',                                zone: Wheat-Sheep,   lat: -34.4014, lon: 146.5049}
      - {code: '221', name: 'VIC Mallee',                                  zone: Wheat-Sheep,   lat: -35.1072, lon: 142.1623}
      - {code: '222', name: 'VIC Wimmera',                                 zone: Wheat-Sheep,   lat: -36.4753, lon: 141.8499}
      - {code: '322', name: 'QLD Western Downs and Central Highlands',     zone: Wheat-Sheep,   lat: -25.2380, lon: 149.0099}
      - {code: '421', name: 'SA Eyre Peninsula',                           zone: Wheat-Sheep,   lat: -33.3796, lon: 136.1039}
      - {code: '521', name: 'WA Central and Southern Wheat Belt',          zone: Wheat-Sheep,   lat: -31.6075, lon: 117.1038}
      - {code: '522', name: 'WA Northern and Eastern Wheat Belt',          zone: Wheat-Sheep,   lat: -30.3843, lon: 118.2580}
      - {code: '631', name: 'TAS Tasmania',                                zone: High Rainfall, lat: -42.1424, lon: 146.6725}
    known_quirks:
      - 'API key management. OPENWEATHER_API_KEY stored in .env (gitignored per scope v5 §11.11),
        loaded via python-dotenv. Never logged in cleartext; masked ("061dc7…9e58") in console
        output. .env.example provides a template.'
      - 'HTTP 504 transient during initial run (auto-recovered on resume). During 2026-05-18
        initial run, region 222 date 2022-11-23 failed after 3 retries with HTTP 504 (Gateway
        Timeout). On 2026-07-09 resume run (52 days later), the same date auto-recovered on the
        first attempt. HTTP 504 confirmed transient. An ad-hoc phase01_s08b_refetch_singleton.py
        script was drafted for this date and retired as redundant when the main resume auto-
        recovered the record; never committed to git.'
      - 'pyarrow first-use rule violation (corrected in-flight). pyarrow was not initially listed
        in requirements.txt when Parquet persistence was added. First execution crashed at the first
        Parquet write (~300-400 calls in). Corrective action: pip install pyarrow>=15;
        requirements.txt updated in the same commit; re-ran. First-use rule reinforced in scope v5
        §9.2, §11.7.'
      - 'Region 322 name reconciliation. During s08a manual approval, region 322 was verbally
        referred to as "QLD Eastern Darling Downs". The AAGIS shapefile actually labels code 322 as
        "QLD Western Downs and Central Highlands". Same broadacre-relevant area; shapefile name is
        canonical.'
      - 'Effective rate ~22 calls/min (API-server-side limit). Client-side rate is 60 calls/min
        (60 / 1.05s sleep). Actual throughput ~22 calls/min due to OpenWeather backend response
        time. Not a client-side rate-limit issue; expected behaviour.'
      - 'File size variation (21.8-30.5 KB) is climatic, not a defect. Smaller Parquet files
        (~22 KB, e.g. region 123 NSW Riverina, region 521 WA Central WB) correspond to arid regions
        where daily precipitation and wind values are frequently absent or near-zero, enabling more
        effective Parquet dictionary compression.'
      - 'Cost containment. Daily hard limit set to 11,000 calls in OpenWeather dashboard. Script
        soft-quota at DAILY_CALL_QUOTA=10,500. Total cost across both sessions: ~£11.40 ≈ AUD $22.
        First session (2026-05-18): 10,500 calls, ~£11.40. Resume session (2026-07-09): 460 calls,
