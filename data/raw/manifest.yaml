        description: IANA timezone identifier at the query location.
      - field: tmin_c
        type: float64
        unit: '°C'
        description: Daily minimum temperature.
      - field: tmax_c
        type: float64
        unit: '°C'
        description: Daily maximum temperature.
      - field: t_morning_c
        type: float64
        unit: '°C'
