      NEVER a training input for Pillars 3-4.
    retrieval:
      method: HTTPS REST API (One Call 3.0 day_summary endpoint), one call per (region, date).
      url_pattern: https://api.openweathermap.org/data/3.0/onecall/day_summary?lat={lat}&lon={lon}&date={YYYY-MM-DD}&units=metric&appid={key}
      retrieval_date_range: ['2026-05-18', '2026-07-09']
      retriever: scripts/phase01_s08_ingest_openweather.py + src/ingestion/openweather.py +
        src/processing/aagis_centroids.py
    format: Parquet (pyarrow engine), one file per (region, year).
    spatial_unit: Point query at AAGIS region centroid (`shapely.geometry.representative_point()`).
    crs_upstream: EPSG:4326 (WGS84)
    crs_stored: EPSG:4326 (WGS84)
    n_features: 10
    n_features_note: '10 sampled AAGIS region centroids × 1,096 days (2022-01-01 to 2024-12-31) =
      10,960 daily records target. 10,960 / 10,960 (100.0%) acquired. Empirical: phase01 s08.'
    paths:
