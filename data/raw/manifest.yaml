project:
  name: agriculture-risk-monitoring-system
  scope_version: v5.2
  manifest_schema_version: '1.0'
  description: Data source registry for Project 5. Each entry under 'sources' records canonical
    provenance (retrieval URL, date, retriever), storage layout, semantic schema, known quirks,
    license, and per-file verification metadata.
  policy:
    reproducibility: Level 2 during Phases 01-09; Level 3 (pinned metadata) at v1.0.
    updates: New sources are appended to 'sources'. Substantive edits to existing entries increment
      the entry's revision.
    determinism: Data files are gitignored; this manifest is committed so the repository documents
      how to reproduce them.

data_dirs:
  raw: data/raw
  processed: data/processed

sources:

  - key: aagis_regions
    name: ABARES AAGIS regions (shapefile)
    provider: Australian Bureau of Agricultural and Resource Economics and Sciences (ABARES)
    phase_added: '01'
    role_in_project: Primary spatial unit for AAGIS-level yield modelling and cross-method risk
      comparison (Pillars 3, 4, 5, 6).
    retrieval:
      method: HTTPS direct download
      url: https://www.agriculture.gov.au/sites/default/files/documents/aagis_asgs16v1_g5a.shp_.zip
      retrieval_date: '2026-05-13'
      retriever: scripts/phase01_s01_init_manifest_and_fetch_aagis.py + src/ingestion/aagis_regions.py
    format: ESRI shapefile bundle (.shp + .shx + .dbf + .prj + .cpg) inside a ZIP.
    spatial_unit: AAGIS region (matches the Regional level of the ABARES Farm Data Portal).
    crs_upstream: EPSG:4283 (GDA94; recorded in .prj as GCS_GDA_1994)
    crs_stored: EPSG:4326 (WGS84) after Phase 01 reprojection; EPSG:4283 preserved in raw zip.
    n_features: 32
    n_features_note: 'ABARES has published two different AAGIS region counts across contexts: the
      shapefile aagis_asgs16v1_g5a contains 32 regions (verified empirically 2026-05-13). Some
      ABARES text descriptions cite ~60. The 32-region shapefile count is authoritative for spatial
      operations; the ~60 count refers to older / aggregated groupings not represented in the current
      shapefile.'
    paths:
      raw: data/raw/aagis_regions/aagis_asgs16v1_g5a.shp_.zip
      raw_gitignored: true
      processed: data/processed/aagis_regions_repaired.gpkg (WGS84; geometry validity fixed via
        shapely.make_valid).
    data_dictionary:
      - field: AAGIS
        type: integer
        description: 3-digit AAGIS region code (1st digit = state, 2nd = zone, 3rd = region within
          zone).
      - field: AAGISzone
        type: string
        description: Zone label (Pastoral / Wheat-Sheep / High Rainfall). Broadacre cropping is
          concentrated in the Wheat-Sheep and High Rainfall zones; Pastoral regions are excluded
          from the cropping analysis.
      - field: STE_NAME21
        type: string
        description: 'State/Territory long name (e.g., ''New South Wales'').'
      - field: STATE
        type: string
        description: State/Territory abbreviation.
      - field: geometry
        type: Polygon / MultiPolygon
        description: Region boundary. Some polygons ship with self-intersecting rings or invalid
          orientation and require repair before spatial joins.
    known_quirks:
      - 'Known geometry-validity issues in the source shapefile. The `read.abares` R package
        documents these and auto-applies `sf::st_make_valid()` on import; the Python ingestion
        pipeline applies `shapely.make_valid()` at the same step and verifies validity before
        writing the processed GeoPackage.'
      - 'Filename ships with a trailing underscore before the .zip extension (`.shp_.zip`). This is
        an ABARES convention, not a filesystem quirk.'
      - 'Region code semantics are hierarchical (state / zone / region-within-zone). Downstream
        code should never string-slice codes; use AAGISzone or an explicit lookup instead.'
      - 'Region-key mismatch vs ABARES Farm Data Portal: shapefile identifies regions by 3-digit
        integer codes (e.g. 121); the FDP regional CSV identifies the same regions by text names
        (e.g. NSW Riverina). Both have 32 regions, structurally aligned. Explicit code-to-name
        mapping table required for downstream spatial joins; deferred to Phase 02 (scope v5 §11.6,
        src/processing/region_aggregation.py). Empirical finding: phase01 s06.'
    license: Creative Commons Attribution 4.0 International (CC BY 4.0)
    attribution: 'Australian Bureau of Agricultural and Resource Economics and Sciences (ABARES),
      Australian Agricultural and Grazing Industries Survey — AAGIS regions.'
    citation: 'Australian Bureau of Agricultural and Resource Economics and Sciences. AAGIS regions
      shapefile (aagis_asgs16v1_g5a). Canberra: ABARES; accessed 2026-05-13.'
    renewal_or_versioning: 'ABARES occasionally reissues AAGIS geometries when ASGS statistical
      boundaries update. Refresh policy: check ABARES page at each new scope version; no automatic
      refresh.'
    verification_check:
      spatial_bounds_wgs84:
        min_lon: 112.9
        max_lon: 154.0
        min_lat: -43.7
        max_lat: -10.6
      expected_n_features: 32
      n_broadacre_regions_estimated_note: 'Broadacre cropping is concentrated in the Wheat-Sheep
        zone and higher-rainfall subset of the High Rainfall zone; the exact usable-region count for
        Pillars 3-4 will be finalised in Phase 03 EDA after examining data density per region.'

  - key: aclump
    name: ACLUMP catchment-scale land use raster (v2, 50 m)
    provider: Australian Bureau of Agricultural and Resource Economics and Sciences (ABARES),
      Australian Collaborative Land Use and Management Program.
    phase_added: '01'
    role_in_project: Source of the broadacre cropping-area mask (scope v5 §4.4) that constrains
      SILO grid ingestion (§4.1) and defines the spatial scope of Pillar 1-2 grid-level analyses.
    retrieval:
      method: HTTPS direct download
      url: https://www.agriculture.gov.au/sites/default/files/documents/clum_50m_2023_v2.zip
      retrieval_date: '2026-05-14'
      retriever: scripts/phase01_s02_init_aclump.py + src/ingestion/aclump.py
    format: Single-band GeoTIFF inside a ZIP, with descriptive metadata PDF.
    spatial_unit: 50 m raster cell (native).
    crs_upstream: EPSG:3577 (GDA94 / Australian Albers).
    crs_stored: EPSG:3577 in raw. Reprojection to SILO 0.05° WGS84 grid performed in s03 for mask
      construction; reprojected raster is not persisted (only the derived mask is).
    n_features: null
    n_features_note: 'Raster, not vector — cell counts rather than feature counts. ALUM class 3.3
      "Cropping" occupies 5.131% of non-NODATA pixels across the continental raster (verified
      empirically 2026-05-14, phase01 s02).'
    paths:
      raw: data/raw/aclump/
      raw_gitignored: true
      processed: data/processed/cropping_mask.nc (derived at phase01 s03).
    data_dictionary:
      - field: band_1
        type: integer
        description: ALUM classification code per CLUM_DescriptiveMetadata_December2023.pdf. Broad
          class 3.3 = Cropping (broadacre); target class for the cropping mask.
    known_quirks:
      - 'Vintage acquired: clum_50m_2023_v2 (December 2023).'
      - 'Native CRS differs from SILO grid CRS. Reprojection from EPSG:3577 (Albers, metric) to
        EPSG:4326 (WGS84, degrees) at 0.05° resolution is applied at s03 before mask construction
        via rasterio.warp.'
      - 'Cropping-mask threshold sensitivity study performed at s03 with three thresholds (0.05,
        0.10, 0.20 fraction of SILO 0.05° grid cell classified as broadacre cropping in ACLUMP).
        Primary threshold selected: 0.05 (t005), most permissive, captures broadacre boundary well.
        Alternate thresholds (t010, t020) persisted for Phase 02 sensitivity analysis.'
    license: Creative Commons Attribution 4.0 International (CC BY 4.0)
    attribution: 'ABARES — Australian Collaborative Land Use and Management Program (ACLUMP),
      catchment-scale land use of Australia (December 2023 v2 release).'
    citation: 'ABARES. Catchment-scale land use of Australia — Update December 2023 (v2). Canberra:
      ABARES; accessed 2026-05-14.'
    renewal_or_versioning: 'ABARES updates catchment-scale land use approximately every 1-2 years.
      Project 5 v1.0 uses the 2023 v2 release; refresh discretionary at future scope versions.'
    verification_check:
      raw_file_size_tif_mb_approx: 286
      raw_file_size_zip_mb_approx: 151
      cropping_class_fraction_of_non_nodata: 0.05131
      mask_n_true_cells_at_t005: 28721

  - key: silo
    name: SILO daily gridded climate data (Long Paddock)
    provider: Queensland Department of Environment, Science and Innovation (formerly DAF) — SILO /
      Long Paddock.
    phase_added: '01'
    role_in_project: Primary daily climate input (scope v5 §4.1). Grid-level climate indicators
      (Pillar 1) and EVT tail estimation (Pillar 2) computed at SILO native resolution before any
      region-level aggregation.
    retrieval:
      method: HTTPS direct download from AWS S3 mirror (per-year, per-variable NetCDF).
      url_pattern: https://s3-ap-southeast-2.amazonaws.com/silo-open-data/Official/annual/<variable>/<year>.<variable>.nc
      retrieval_date: '2026-05-15'
      retriever: scripts/phase01_s04_ingest_silo.py + src/ingestion/silo.py
    format: NetCDF4 (xarray-compatible), one file per (variable, year).
    spatial_unit: 0.05° × 0.05° (~5 km) grid cell on WGS84.
    crs_upstream: EPSG:4326 (WGS84)
    crs_stored: EPSG:4326 (WGS84)
    n_features: null
    n_features_note: 'Gridded data (not vector). 375 masked NetCDF files persisted after cropping-
      mask application at phase01 s03 (t005 threshold, 28,721 True cells).'
    paths:
      raw: data/raw/silo/<variable>/<year>.nc (transient, cleared post-mask-application)
      raw_gitignored: true
      processed: data/processed/silo/<variable>/<year>.nc (with cropping mask applied)
    data_dictionary:
      - field: max_temp
        type: float32
        unit: '°C'
        description: Daily maximum air temperature at ~2m; SILO variable code max_temp.
        period_years: [1961, 2024]
      - field: min_temp
        type: float32
        unit: '°C'
        description: Daily minimum air temperature at ~2m; SILO variable code min_temp.
        period_years: [1961, 2024]
      - field: daily_rain
        type: float32
        unit: mm
        description: Daily accumulated rainfall; SILO variable code daily_rain.
        period_years: [1961, 2024]
      - field: vp
        type: float32
        unit: hPa
        description: Vapour pressure; SILO variable code vp. Used for humidity-based derivations.
        period_years: [1961, 2024]
      - field: radiation
        type: float32
        unit: MJ/m²/day
        description: Daily solar radiation; SILO variable code radiation.
        period_years: [1961, 2024]
      - field: evap_pan
        type: float32
        unit: mm
        description: Daily pan evaporation; SILO variable code evap_pan. Used as input to SPEI
          calculation in Pillar 1.
        period_years: [1970, 2024]
        note: 'Effective start = 1970 (empirical finding, phase01 s04). Pre-1970 files are
          structurally sparse or absent at continental extent.'
    known_quirks:
      - 'evap_pan effective start = 1970, not 1961 like other variables. Retrieval attempts for
        1961-1969 returned structurally sparse or absent files. Downstream consequence: SPEI
        computation (which uses evap_pan) is constrained to 1970+ per scope v5 §3.3, §4.1, §5.1.
        9 pre-1970 evap_pan attempts are explicitly skipped and logged. Empirical finding:
        phase01 s04.'
      - 'Post-mask storage discipline. Raw continental NetCDFs (~30 MB × 375 files) are large. To
        limit disk pressure, the ingestion module applies the cropping mask on the fly and does not
        retain the un-masked raw files after mask application confirms success. Final on-disk
        volume post-mask: ~11.64 GB.'
      - 'File naming convention: `<year>.<variable>.nc` — year first, then variable. Different from
        some other climate datasets where the order is reversed.'
    license: Creative Commons Attribution 4.0 (per Long Paddock terms).
    attribution: 'Data from the Long Paddock SILO drill, Queensland Government, Australia.'
    citation: 'Queensland Department of Environment, Science and Innovation. SILO gridded daily
      climate data. Long Paddock; accessed 2026-05-15.'
    renewal_or_versioning: 'SILO is updated daily; project uses annual per-variable NetCDFs frozen
      at the 2026-05-15 retrieval snapshot. Re-retrieval at each scope version if time coverage
      needs to be extended.'
    verification_check:
      n_files_persisted: 375
      total_size_gb_approx: 11.64
      variables_count: 6

  - key: bom_acornsat
    name: BoM ACORN-SAT homogenised station temperature (94 stations, tmin + tmax)
    provider: Australian Bureau of Meteorology (BoM)
    phase_added: '01'
    role_in_project: Homogenised station-level temperature reference (scope v5 §4.2). Cross-validates
      SILO regional aggregates against direct station observations in Phase 02.
    retrieval:
      method: HTTPS direct download (master list + per-station-per-variable CSVs).
      station_list_url: https://www.bom.gov.au/climate/change/acorn-sat/map/stations-acorn-sat.txt
      per_station_url_pattern: https://www.bom.gov.au/climate/change/hqsites/data/temp/<variable>.<6-digit-id>.daily.csv
      retrieval_date: '2026-05-16'
      retriever: scripts/phase01_s05_ingest_bom_acornsat.py + src/ingestion/bom_acornsat.py
    format: Per-station CSV, one per (variable, station).
    spatial_unit: Point station (lat/lon in the master list).
    crs_upstream: EPSG:4326 (WGS84)
    crs_stored: EPSG:4326 (WGS84)
    n_features: 94
    n_features_note: '112 stations nominal per the ACORN-SAT master list; 18 permanently unavailable
      at the BoM hqsites endpoint (all zero-padding variants return HTTP 404). Effective count = 94.
      Empirical finding: phase01 s05.'
    paths:
      raw: data/raw/acorn_sat/station_list.csv
      raw_gitignored: true
      processed: data/processed/bom_acornsat/<variable>/<station_id>_daily.csv
    data_dictionary:
      - field: stn_num
        type: integer
        description: 6-digit BoM station number. Master list uses `stn_num`; the raw served CSV
          historically also used `stnnum`. A synonym-map at load time normalises to `stn_num`.
      - field: stn_name
        type: string
        description: Station name.
      - field: lat
        type: float
        description: Latitude (WGS84).
      - field: lon
        type: float
        description: Longitude (WGS84).
      - field: elevation
        type: float
        description: Elevation (m).
      - field: start
        type: string YYYY-MM-DD
        description: Record start date.
      - field: (per-station CSV) date
        type: string YYYY-MM-DD
        description: Observation date.
      - field: (per-station CSV) tmax OR tmin
        type: float
        unit: '°C'
        description: Homogenised daily temperature value; variable indicated by the file name.
    known_quirks:
      - '18 stations unavailable at BoM hqsites endpoint (empirical finding, phase01 s05). Station
        IDs: 002012, 005026, 008039, 008051, 009510, 009741, 010579, 017031, 023090, 030045, 046037,
        046043, 059040, 060139, 066062, 073054, 086071, 094010. Encoded as
        ACORN_SAT_UNAVAILABLE_STATIONS frozenset in src/ingestion/bom_acornsat.py. 3 of the 18 are
        broadacre-region relevant: 008039 WA Wheatbelt, 008051 WA Wheatbelt margin, 073054 NSW
        Riverina. Phase 02 will assess coverage impact on regional SILO validation.'
      - 'Column-name synonyms in the served station list (`stn_num` vs `stnnum`). Synonym-map
        applied at load time in `src/ingestion/bom_acornsat.py::_CANONICAL_COLUMNS`.'
      - 'lxml dependency avoided. Initial implementation used pandas.read_html on the master list
        page, which required lxml. Replaced with direct CSV endpoint retrieval.'
    license: Creative Commons Attribution 3.0 Australia (BoM standard).
    attribution: 'Bureau of Meteorology, Commonwealth of Australia. ACORN-SAT homogenised
      temperature record.'
    citation: 'Bureau of Meteorology. Australian Climate Observations Reference Network — Surface
      Air Temperature (ACORN-SAT). Melbourne: Bureau of Meteorology; accessed 2026-05-16.'
    renewal_or_versioning: 'BoM periodically updates ACORN-SAT with methodology revisions
      (typically annual). Project 5 v1.0 uses the 2026-05-16 snapshot.'
    verification_check:
      n_stations_nominal: 112
      n_stations_effective: 94
      n_files_persisted: 188
      n_files_note: 94 stations × 2 variables (tmax, tmin) = 188 CSVs.

  - key: abares
    name: ABARES Farm Data Portal — Historical Estimates (Regional, National, State)
    provider: Australian Bureau of Agricultural and Resource Economics and Sciences (ABARES)
    phase_added: '01'
    role_in_project: Primary observed-yield dataset at AAGIS region level (scope v5 §4.3).
      Dependent variable for Pillars 3-5 climate-yield modelling.
    retrieval:
      method: HTTPS direct download (three separate CSVs).
      urls:
        - https://www.agriculture.gov.au/sites/default/files/documents/fdp-regional-historical.csv
        - https://www.agriculture.gov.au/sites/default/files/documents/fdp-national-historical.csv
        - https://www.agriculture.gov.au/sites/default/files/documents/fdp-state-historical.csv
      retrieval_date: '2026-05-17'
      retriever: scripts/phase01_s06_ingest_abares.py + src/ingestion/abares.py
    format: Long-form CSVs (three levels with distinct schemas).
    spatial_unit: AAGIS region (regional CSV); Australia (national CSV); State/Territory (state CSV).
    crs_upstream: n/a (tabular, no geometry)
    crs_stored: n/a
    n_features: 32
    n_features_note: '32 AAGIS regions × 35 financial years × 136 variables = 150,480 rows in the
      regional CSV (empirical: phase01 s06). Same 32 regions as the shapefile — but keyed by text
      name rather than 3-digit code; see known_quirks.'
    paths:
      raw: data/raw/abares/{fdp-regional-historical,fdp-national-historical,fdp-state-historical}.csv
      raw_gitignored: true
      processed: data/processed/abares/{wheat,barley,canola}.csv
    data_dictionary:
      - field: Variable
        type: string
        description: 'Free-text label including unit, e.g. "Wheat area sown (ha)".'
      - field: Year
        type: integer
        description: ABARES financial year ending year (1989-90 → 1990). Range 1990–2024.
      - field: '"ABARES region" (regional CSV only)'
        type: string
        description: 'Text region name (e.g., "NSW Riverina"). Distinct from the shapefile''s
          3-digit code convention.'
      - field: State (state CSV only)
        type: string
        description: State/Territory name.
      - field: Industry (national + state CSVs)
        type: string
        description: '7 values: All Broadacre, Beef, Cropping, Dairy, Mixed, Sheep, Sheep-Beef.
          Not present in the regional CSV.'
      - field: Value
        type: float
        description: 'CRITICAL: survey-weighted per-typical-farm average, NOT region/national
          total. See known_quirks.'
      - field: RSE
        type: float
        description: Relative Standard Error (%). May be blank; preserve as NA (Project 4 lesson).
    known_quirks:
      - 'CRITICAL — per-typical-farm semantics. FDP Value columns represent survey-weighted per-
        typical-farm averages, NOT region/national totals. Verified empirically: National
        Industry="All Broadacre" wheat 2022 = 656 t/farm; 656 × ~55,000 broadacre farms ≈ 36 Mt ≈
        ABS national wheat total. Implication: `yield_t_ha = production_t / area_ha` is
        dimensionally valid as per-farm-representative regional yield; `production_t` and `area_ha`
        require farm-count weighting for conversion to region totals. Phase 02 task: implement
        src/processing/abares_aggregation.py (scope v5 §11.6). Empirical finding: phase01 s06.'
      - 'Three distinct CSV schemas (regional / national / state). Regional lacks Industry
        dimension; national has Industry; state has both State and Industry. Handled via per-level
        upstream_columns + rename maps in FDP_FILES dict of src/ingestion/abares.py.'
      - 'Region-key naming mismatch vs AAGIS shapefile. Shapefile uses 3-digit codes (e.g. 121);
        FDP CSV uses text names (e.g. "NSW Central West"). Both encode 32 aligned regions; explicit
        mapping table required for spatial join. Deferred to Phase 02 (src/processing/
        region_aggregation.py per scope v5 §11.6). Empirical finding: phase01 s06.'
      - 'Year range 1990-2024. Scope v4 originally specified "1980+" for yield modelling; ABARES
        FDP earliest year is 1990. Scope v5 §3.3 updated accordingly.'
    license: Creative Commons Attribution 4.0 International (CC BY 4.0)
    attribution: 'Australian Bureau of Agricultural and Resource Economics and Sciences (ABARES),
      Farm Data Portal — Historical Estimates (Regional, National, State).'
    citation: 'Australian Bureau of Agricultural and Resource Economics and Sciences. Farm Data
      Portal Historical Estimates. Canberra: ABARES; accessed 2026-05-17.'
    renewal_or_versioning: 'ABARES FDP is refreshed with each ABARES farm survey update
      (approximately annual). Project 5 v1.0 uses the 2026-05-17 retrieval snapshot.'
    verification_check:
      regional_csv_rows: 150480
      n_regions: 32
      n_years: 35
      n_variables_distinct: 136
      commodity_files_generated:
        - wheat.csv (1114 rows, 747 non-NA yields)
        - barley.csv (1114 rows, 738 non-NA yields)
        - canola.csv (1114 rows, 482 non-NA yields)

  - key: abs_census
    name: ABS Agricultural Commodities, Australia — 2020-21 financial year (ASGS Edition 3)
    provider: Australian Bureau of Statistics (ABS)
    phase_added: '01'
    role_in_project: SA2-level cross-section for Pillar 4-5 region-importance weighting (scope v5
      §4.3). Not used as time-series. Structural anchor.
    retrieval:
      method: HTTPS direct download
      url: https://www.abs.gov.au/statistics/industry/agriculture/agricultural-commodities-australia/2020-21/AGCDCASGS202021.xlsx
      retrieval_date: '2026-05-17'
      retriever: scripts/phase01_s07_ingest_abs_census.py + src/ingestion/abs_census.py
    format: Single XLSX workbook (2 sheets - Contents metadata + Table 1 data).
    spatial_unit: ASGS Edition 3 regions (National + State + SA4 + SA3 + SA2).
    crs_upstream: n/a (tabular, region codes only)
    crs_stored: n/a
    n_features: 1124
    n_features_note: '1,124 SA2 regions report agricultural activity in 2020-21. Additional
      hierarchy levels (National, State, SA4, SA3) also present in the same table, keyed by digit-
      count of the Region code.'
    paths:
      raw: data/raw/abs_census/AGCDCASGS202021.xlsx
      raw_gitignored: true
      processed: data/processed/abs_census/{wheat,barley,canola}_{sa2,national_state}.csv
    data_dictionary:
      - field: Region code
        type: integer as string
        description: '0 = Australia; 1 digit = State; 3 digits = SA4; 5 digits = SA3; 9 digits =
          SA2. Region-level classification via digit count.'
      - field: Region label
        type: string
        description: Region name.
      - field: Commodity code
        type: string
        description: 'ABS commodity code, e.g. AGCEREAL_AHAWHT_F (wheat area), AGCEREAL_ATOWHT_F
          (wheat production), WHEAT_YIELD_F (wheat yield), AGOTHCROP_AHACAN_F (canola area).'
      - field: Commodity description
        type: string
        description: Human-readable label.
      - field: Estimate
        type: float
        description: Point estimate for the commodity-variable at the region.
      - field: Estimate - Relative Standard Error (Percent)
        type: float
        description: Relative Standard Error of the estimate.
      - field: Number of agricultural businesses
        type: float
        description: Count of agricultural businesses reporting the commodity.
      - field: Number of agricultural businesses - Relative Standard Error (Percent)
        type: float
        description: RSE of the business count.
    known_quirks:
      - 'STRUCTURAL — 2020-21 was the FINAL ABS Agricultural Census. Per ABS publication
        (2022-07-26): "The 2020-21 Agricultural Census was the last Agricultural Census to be
        conducted by the ABS." Post-2020-21 statistics use the modernised pipeline (Levy Payer
        Register + satellite crop mapping), out of Project 5 v1.0 scope. Scope v5 §4.3, §13
        document this constraint. Empirical finding: phase01 s07.'
      - 'Column names ship with surrounding whitespace (e.g. " Estimate " with leading/trailing
        spaces). Not visible in Excel due to alignment. Normalised via
        `raw.columns = [str(c).strip() for c in raw.columns]` in src/ingestion/abs_census.py.'
      - 'Canola classified under AGOTHCROP prefix, not AGOILSEED. ABS classifies canola as
        "Other crops - Oilseeds - Canola" with codes AGOTHCROP_AHACAN_F (area), AGOTHCROP_ATOCAN_F
        (production). Yield has its own namespace: CANOLA_YIELD_F. Initial script guessed
        AGOILSEED_* prefix and failed; corrected via runtime code discovery.'
      - 'Header row is row 7 (0-indexed 6). Rows 1-6 = workbook metadata; row 7 = column headers;
        rows 8+ = data. Handled via `header=6` in pd.read_excel.'
      - 'ABS NA conventions: "..", "np", "-", "nil". Handled via na_values parameter.'
      - 'SA2 counts by commodity (empirical): wheat 394, barley 367, canola 255. Confirms scope
        v5 §3.2 tier structure (wheat > barley > canola in geographic footprint).'
    license: Creative Commons Attribution 4.0 International (ABS default).
    attribution: 'Australian Bureau of Statistics (ABS). Agricultural Commodities, Australia
      2020-21 (ASGS Edition 3 regions).'
    citation: 'Australian Bureau of Statistics. Agricultural Commodities, Australia — 2020-21
      financial year. Canberra: ABS; accessed 2026-05-17.'
    renewal_or_versioning: 'STRUCTURAL — no further ABS Agricultural Census releases planned.
