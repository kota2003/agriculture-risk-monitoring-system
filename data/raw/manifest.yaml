cross_source_concerns:

  - concern_id: region_key_reconciliation
    description: 'AAGIS shapefile (3-digit codes) vs ABARES FDP CSV (text names) vs ABS Census
      (region_code integer, different granularity) all use different region-keying conventions.
      Explicit mapping tables and aggregation utilities required for cross-source joins.'
    resolution_phase: '02'
    resolution_module: src/processing/region_aggregation.py (Phase 02)

  - concern_id: per_farm_vs_region_total
    description: 'ABARES FDP values are per-typical-farm (survey-weighted); ABS Census values are
      region totals. Cross-comparison requires farm-count weighting via ABS `Number of agricultural
      businesses` per region.'
    resolution_phase: '02'
    resolution_module: src/processing/abares_aggregation.py (Phase 02)

  - concern_id: temporal_alignment
    description: 'SILO daily (1961–2024) vs ABARES annual (1990–2024, financial year ending) vs
      ABS 2020-21 single cross-section vs OpenWeather daily (2022–2024). Yield modelling window is
      bounded by ABARES (1990+); SPEI is bounded by SILO evap_pan (1970+); OpenWeather comparison
      is bounded by the 3-year sample window.'
    resolution_phase: '02, 03'
    resolution_module: null

  - concern_id: observation_class_discipline
    description: 'Observed / homogenised / derived_survey / derived_census / land_use_classification
      / api_reanalysis / simulation distinctions must be preserved throughout downstream analysis.
      AGFD (simulation) is never a training target; OpenWeather (api_reanalysis) is a validation
      comparator not a climate input for Pillars 3-5.'
    resolution_phase: 'ongoing (scope v5 §2.5)'
    resolution_module: null

