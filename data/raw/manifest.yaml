project:
  name: agriculture-risk-monitoring-system
  scope_version: v4
  manifest_schema_version: '1.0'
  description: Data source registry for Project 5. Each entry under 'sources' records canonical
    name, publisher, role, license, vintage, observed-vs-derived classification (per scope
    v4 section 4.6), known quirks, and per-pillar usage. Updated by ingestion scripts at retrieval
    time.
  last_updated: '2026-05-13T15:31:02.006826+00:00'
sources:
  aagis_regions:
    canonical_name: Australian Agricultural and Grazing Industries Survey (AAGIS) Region Mapping
      Files
    publisher: Australian Bureau of Agricultural and Resource Economics and Sciences (ABARES),
      Department of Agriculture, Fisheries and Forestry (DAFF)
    role: Primary yield spatial unit per scope v4 section 3.1. AAGIS regions are the finest
      level of geographic aggregation at which ABARES publishes broadacre commodity statistics.
      Used as the natural unit for Pillars 3, 4, 5, 6.
    access:
      portal_url: https://www.agriculture.gov.au/abares/research-topics/surveys/farm-survey-data
      resolved_url: https://www.agriculture.gov.au/sites/default/files/documents/aagis_asgs16v1_g5a.shp_.zip
      file_size_compressed_mb: 2.6
      method: manual_browser_url_capture_then_https_get
    vintage:
      published_date: '2020-08-04'
      published_date_source: Last-Modified HTTP header at 2026-05-14 retrieval
      page_last_updated: '2024-09-09'
      retrieved_date: '2026-05-13T15:31:02.001614+00:00'
      retrieved_by: scripts/phase01_s01_init_manifest_and_fetch_aagis.py
      expected_content_length_bytes: 2637311
      etag_at_first_ingest: '"5f28c824-283dff"'
      asgs_alignment: ASGS 2016
      version_string: asgs16v1_g5a
    license:
      type: Creative Commons
      attribution_required: true
      citation_url: https://www.agriculture.gov.au/abares/products/citations
    classification:
      observed_or_derived: observed
      pillar_use:
      - P3 primary unit (statistical climate-yield models)
      - P4 primary unit (ML models)
      - P5 primary unit (spatio-temporal models)
      - P6 primary unit (multi-method synthesis)
    field_dictionary:
      pending_first_ingest: false
      region_count: 32
      zones_present:
      - High Rainfall
      - Pastoral
      - Wheat Sheep
      crs: EPSG:4283
      bounding_box_xyxy:
      - 112.92112402285545
      - -43.7404804229736
      - 153.63859748840332
      - -9.142306014410913
      geometry_repair_log:
        invalid_before: 2
        invalid_after: 0
    known_quirks:
    - id: geometry_errors
      description: Self-intersecting polygons and invalid ring orientations in source shapefile,
        documented by the read.abares R package (which auto-applies sf::st_make_valid on import).
      mitigation: GeoSeries.make_valid() (vectorized via shapely 2.x) applied during ingestion in src/ingestion/aagis_regions.py::repair_aagis_geometries.
      reference: scope v4 section 3.1; PROJECT_LOG entry 2026-05-14
    persisted_paths:
      raw: data/raw/aagis_regions/
      processed: data/processed/aagis_regions_repaired.gpkg
    notes:
    - 'AAGIS uses two-level hierarchy: zones (Pastoral, Wheat Sheep, High Rainfall) x regions. ASGS16 v1 vintage contains 32 regions: 12 Pastoral, 12 Wheat Sheep, 8 High Rainfall. Scope v4 section 3.1 originally estimated "~60 regions" and used hyphenated zone names; both corrected empirically at s01 first run 2026-05-14.'
    - Pastoral-zone regions are excluded from the cropping analysis per scope v4 section 3.1. Cropping-relevant subset = 20 regions (12 Wheat Sheep + 8 High Rainfall).
    - 'class column (3-digit integer) appears to encode state x zone x region: first digit = state (1=NSW, 2=VIC, 3=QLD, 4=SA, 5=WA, 6=TAS, 7=NT), second digit = zone (1=Pastoral, 2=Wheat Sheep, 3=High Rainfall), third digit = region index within state x zone. Empirical pattern confirmed against all 32 codes; to be formally verified in Phase 03 EDA.'
    - 'MAUP-study scale note: cropping AAGIS regions (n=20) and GRDC agro-ecological zones (n~21) are at near-equivalent aggregation granularity, not contrasting resolutions as scope v4 section 5.6.2 implicitly assumes. This narrows the MAUP-study interpretive yield. Decision: retain GRDC re-aggregation as robustness check, but caveat the framing in Pillar 6 write-up. Logged in PROJECT_LOG 2026-05-14.'
  aclump:
    canonical_name: "Catchment Scale Land Use of Australia"
    short_name: "ACLUMP CLUM"
    version: "Update December 2023, version 2"
    publisher: "ABARES (Australian Bureau of Agricultural and Resource Economics and Sciences)"
    role: "Land use raster - source of broadacre cropping mask"

    access:
      raster_zip_url: "https://www.agriculture.gov.au/sites/default/files/documents/clum_50m_2023_v2.zip"
      metadata_docx_url: "https://www.agriculture.gov.au/sites/default/files/documents/CLUM_DescriptiveMetadata_December2023_v2.docx"
      method: "HTTPS direct download (no auth)"
      content_length_bytes: 158077503    # 150.7 MB; PDF page says 126 MB (stale)
      content_type: "application/zip"

    vintage:
      first_published: "2024-02-26"
      revised: "2024-06-27"                 # version 2 release (minor WA + TAS fixes)
      etag: '"667cf4a9-96c123f"'             # captured via DevTools 2026-05-14
      last_modified_http: "Thu, 27 Jun 2024 05:12:09 GMT"
      retrieved: null                        # filled at runtime by phase01_s02 script

    license:
      type: "CC BY 4.0"
      doi: "10.25814/2w2p-ph98"
      citation: >-
        ABARES 2024, Catchment Scale Land Use of Australia - Update
        December 2023 version 2, Australian Bureau of Agricultural and
        Resource Economics and Sciences, Canberra, June, CC BY 4.0,
        DOI: 10.25814/2w2p-ph98.

    classification:
      observed_or_derived: "observed"        # state vector mapping rasterised
      pillar_use:
        - "Phase 01 sec. 4.4 (cropping mask source)"
        - "scope v4 sec. 3.6.1 (spatial subsetting only)"
      excluded_uses:
        - "NEVER used as feature input to P3-P4 yield models"
        - "NEVER used as a yield surrogate"

    raster_properties:
      filename_in_zip: "clum_50m_2023_v2.tif"
      crs: "EPSG:3577"                       # GDA94 / Australian Albers, metres
      resolution_metres: 50
      dtype: "int16"
      pixel_value_meaning: "Three-digit ALUM 8 code (hundreds=primary, tens=secondary, units=tertiary)"
      bounding_box_albers:
        north: -1047650
        south: -4847000
        east:  21220000
        west:  -1888000

    alum_classification:
      version: 8
      reference: "Table A1 of CLUM_DescriptiveMetadata_December2023_v2.docx"
      broadacre_cropping_codes:  [330, 331, 332, 333, 334, 335, 336, 337, 338]   # 3.3 Cropping
      excluded_irrigated_codes:  [430, 431, 432, 433, 434, 435, 436, 437, 438, 439]   # 4.3 Irrigated cropping
      excluded_transition_codes: [360, 361, 362, 363, 364, 365]   # 3.6 Land in transition

    known_quirks:
      state_vintage_variance: >-
        Source state vintages range 2012 (ACT) to 2022 (NT). For broadacre
        core regions: NSW = 2017 v1.5, WA = 2018, VIC = 2021, SA = 2017,
        TAS = 2021. Acceptable as a static cropping footprint under
        scope v4 sec. 3.3 modern-agronomy framing (1980+ yield window
        tolerates 5-10 yr cropping-extent stationarity assumption).
      wa_visual_attribution: >-
        In WA, ALUM 4.0.0 / 5.0.0 / 6.0.0 attributed to secondary level
        by visual interpretation using satellite data. Does NOT affect
        3.3 Cropping broadacre mask (handled in original vector layer).
      sa_adelaide_voids: >-
        Adelaide NODATA voids filled from ABS 2021 mesh blocks. Mapped
        only to residential / services / pasture mosaic classes, never
        to 3.3 Cropping. Does NOT affect broadacre mask.
      nodata_focal_filled: >-
        Remaining NODATA voids elsewhere filled via ArcGIS focal
        statistics (nearest-neighbour-like). Minor mask precision
        degradation expected in voids; broadacre regions have dense
        original coverage, impact small.
      raster_size_advertised_vs_actual: >-
        ABARES page advertises ZIP size as 126 MB; HTTP Content-Length
        is 158,077,503 bytes (150.7 MB). HTTP header is authoritative;
        page text is stale rounding from initial 2024-02 release.

    persisted_paths:
      raw_zip:           "data/raw/aclump/clum_50m_2023_v2.zip"
      raw_tif:           "data/raw/aclump/clum_50m_2023_v2.tif"
      metadata_docx:     "data/raw/aclump/CLUM_DescriptiveMetadata_December2023_v2.docx"
      processed_mask:    "data/processed/cropping_mask.nc"   # produced by s03

    out_of_scope_artefacts:
      # The ZIP also contains these; we don't extract or use them in s02.
      - "Layer files (.lyrx / .lyr / .qml) for ArcGIS / QGIS visualisation"
      - "scale_date_update.zip (nested): date_clum_2023.tif, scale_clum_2023.tif, updates_clum_2023.tif"
      # If sanity checks fail in s03, scale_date_update.zip becomes
      # diagnostic material; until then it's left compressed for provenance.

    related_dataset_not_retrieved:
      catchment_scale_land_use_commodities:
        reason: "Out of scope per s02 decision 4 (PROJECT_LOG 2026-05-14)"
        revisit_condition: "s03 cropping mask sanity check failure"
      date_and_scale_shapefile:
        size_mb: 398
        reason: "Not required for cropping mask construction"
        revisit_condition: "Spatial pattern in s03 mask quality issues suggests vintage-driven cause"
